[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "second-brain"
version = "0.1.0"
description = "Private, source-backed daily assistant and second brain"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["sb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
